name: Optional AWS live conformance

on:
  workflow_dispatch:
    inputs:
      role-to-assume:
        description: IAM role ARN authorized only for an isolated Ubeeq self-host stack
        required: true
        type: string
      region:
        description: AWS region
        required: true
        default: us-east-2
        type: string
      stack-name:
        description: Isolated CloudFormation stack name
        required: true
        default: UbeeqSelfHostLive
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  conformance:
    environment: aws-self-host-live
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ inputs.region }}
      STACK_NAME: ${{ inputs.stack-name }}
      TEST_USERNAME: ubeeq-live-${{ github.run_id }}@invalid.example
      TEST_PASSWORD: UbeeqLive${{ github.run_id }}A!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ inputs.region }}
      - run: npm ci
      - run: npm run build
      - name: Deploy isolated optional self-host stack
        run: npm run deploy --workspace @ubeeq/aws-self-host-infra -- --require-approval never
      - name: Read stack outputs
        run: |
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs' --output json > /tmp/ubeeq-outputs.json
          node -e 'const o=require("/tmp/ubeeq-outputs.json"); for (const x of o) console.log(`${x.OutputKey}=${x.OutputValue}`)' >> "$GITHUB_ENV"
      - name: Create disposable Cognito test user
        run: |
          aws cognito-idp admin-create-user --user-pool-id "$UserPoolId" --username "$TEST_USERNAME" --user-attributes Name=email,Value="$TEST_USERNAME" Name=email_verified,Value=true --message-action SUPPRESS
          aws cognito-idp admin-set-user-password --user-pool-id "$UserPoolId" --username "$TEST_USERNAME" --password "$TEST_PASSWORD" --permanent
      - name: Run AWS adapter conformance
        run: |
          UBEEQ_AWS_REGION="$AWS_REGION" UBEEQ_AWS_RECORDS_TABLE="$RecordsTableName" UBEEQ_AWS_OBJECT_BUCKET="$SourceStoreName" UBEEQ_AWS_JOBS_QUEUE_URL="$JobsQueueUrl" UBEEQ_AWS_USER_POOL_ID="$UserPoolId" UBEEQ_AWS_USER_POOL_CLIENT_ID="$UserPoolClientId" UBEEQ_AWS_TEST_USERNAME="$TEST_USERNAME" UBEEQ_AWS_TEST_PASSWORD="$TEST_PASSWORD" npm run test:live --workspace @ubeeq/adapters-aws
      - name: Run authenticated API upload, worker, publication, and delivery flow
        run: |
          UBEEQ_AWS_API_URL="$ReferenceApiGatewayUrl" UBEEQ_AWS_REGION="$AWS_REGION" UBEEQ_AWS_RECORDS_TABLE="$RecordsTableName" UBEEQ_AWS_OBJECT_BUCKET="$SourceStoreName" UBEEQ_AWS_USER_POOL_CLIENT_ID="$UserPoolClientId" UBEEQ_AWS_TEST_USERNAME="$TEST_USERNAME" UBEEQ_AWS_TEST_PASSWORD="$TEST_PASSWORD" npm run test:aws --workspace @ubeeq/reference-api
      - name: Delete disposable identity
        if: always()
        run: aws cognito-idp admin-delete-user --user-pool-id "$UserPoolId" --username "$TEST_USERNAME" || true
