name: Rust migration control API

on:
  pull_request:
    paths:
      - .github/workflows/rust-migration-control-api.yml
      - deployments/aws-serverless/multi-cell/**
      - deployments/aws-serverless/single-cell/**
      - deployments/aws-serverless/migration-control-rust/**
  push:
    branches: [main]
    paths:
      - .github/workflows/rust-migration-control-api.yml
      - deployments/aws-serverless/multi-cell/**
      - deployments/aws-serverless/single-cell/**
      - deployments/aws-serverless/migration-control-rust/**

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: public.ecr.aws/amazonlinux/amazonlinux:2023
    defaults:
      run:
        working-directory: deployments/aws-serverless/migration-control-rust
    steps:
      - name: Install build dependencies
        working-directory: .
        run: dnf install -y gcc gcc-c++ make cmake pkgconf-pkg-config git tar gzip zip
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          curl --fail --silent --show-error https://sh.rustup.rs --output /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.100.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo test --locked --features worker
      - name: Build the Linux Lambda ZIPs
        run: |
          cargo build --locked --release --features worker
          test -x target/release/bootstrap
          zip -j migration-control-api-rust.zip target/release/bootstrap
          mkdir -p target/worker-package
          cp target/release/migration-worker target/worker-package/bootstrap
          test -x target/worker-package/bootstrap
          zip -j migration-control-worker-rust.zip target/worker-package/bootstrap
          mkdir -p target/cell-package
          cp target/release/migration-cell target/cell-package/bootstrap
          test -x target/cell-package/bootstrap
          zip -j migration-cell-rust.zip target/cell-package/bootstrap
          mkdir -p target/reference-api-package
          cp target/release/reference-api target/reference-api-package/bootstrap
          test -x target/reference-api-package/bootstrap
          zip -j reference-api-rust.zip target/reference-api-package/bootstrap
          mkdir -p target/reference-worker-package
          cp target/release/reference-worker target/reference-worker-package/bootstrap
          test -x target/reference-worker-package/bootstrap
          zip -j reference-worker-rust.zip target/reference-worker-package/bootstrap
      - uses: actions/upload-artifact@v4
        with:
          name: migration-control-api-rust-al2023-x86-64
          path: deployments/aws-serverless/migration-control-rust/migration-control-api-rust.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: migration-control-worker-rust-al2023-x86-64
          path: deployments/aws-serverless/migration-control-rust/migration-control-worker-rust.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: migration-cell-rust-al2023-x86-64
          path: deployments/aws-serverless/migration-control-rust/migration-cell-rust.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: reference-worker-rust-al2023-x86-64
          path: deployments/aws-serverless/migration-control-rust/reference-worker-rust.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: reference-api-rust-al2023-x86-64
          path: deployments/aws-serverless/migration-control-rust/reference-api-rust.zip
          if-no-files-found: error
