name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        # Official DynamoDB Local 3.3.2 multi-platform manifest, pinned by digest.
        image: amazon/dynamodb-local@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
        ports:
          - 127.0.0.1:8000:8000
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ubeeq
          POSTGRES_PASSWORD: ubeeq
          POSTGRES_DB: ubeeq_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ubeeq -d ubeeq_contract"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DYNAMODB_ENDPOINT: http://127.0.0.1:8000
      UBEEQ_POSTGRES_TEST_URL: postgresql://ubeeq:ubeeq@localhost:5432/ubeeq_contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:managed-websites
      - run: npm run test:managed-creator-intake
      - run: npm run test:managed-processed-outputs
