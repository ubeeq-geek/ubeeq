name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ubeeq
          POSTGRES_PASSWORD: ubeeq
          POSTGRES_DB: ubeeq_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ubeeq -d ubeeq_contract"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      UBEEQ_POSTGRES_TEST_URL: postgresql://ubeeq:ubeeq@localhost:5432/ubeeq_contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
