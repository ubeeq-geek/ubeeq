services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ubeeq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ubeeq
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubeeq -d ubeeq"]
      interval: 10s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      UBEEQ_S3_BUCKET: ${UBEEQ_S3_BUCKET:?Set UBEEQ_S3_BUCKET in .env}
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
      mc mb --ignore-existing "local/$$UBEEQ_S3_BUCKET";
      mc version enable "local/$$UBEEQ_S3_BUCKET"
    depends_on:
      minio:
        condition: service_healthy

  reference-api:
    build:
      context: ../..
      dockerfile: examples/machine/scalable-single-cell/Dockerfile
    command: node apps/reference-api/dist/machine-server.js
    environment: &ubeeq-environment
      PORT: "4100"
      UBEEQ_LISTEN_HOST: 0.0.0.0
      UBEEQ_PUBLIC_BASE_URL: https://${UBEEQ_PUBLIC_HOST:?Set UBEEQ_PUBLIC_HOST in .env}
      UBEEQ_INSTANCE_ID: ${UBEEQ_INSTANCE_ID:?Set UBEEQ_INSTANCE_ID in .env}
      UBEEQ_CELL_ID: ${UBEEQ_CELL_ID:?Set UBEEQ_CELL_ID in .env}
      UBEEQ_CELL_REGION: ${UBEEQ_CELL_REGION:?Set UBEEQ_CELL_REGION in .env}
      UBEEQ_CELL_OPERATOR: ${UBEEQ_CELL_OPERATOR:?Set UBEEQ_CELL_OPERATOR in .env}
      UBEEQ_POSTGRES_URL: postgresql://ubeeq:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ubeeq
      UBEEQ_S3_ENDPOINT: http://minio:9000
      UBEEQ_S3_REGION: us-east-1
      UBEEQ_S3_BUCKET: ${UBEEQ_S3_BUCKET:?Set UBEEQ_S3_BUCKET in .env}
      UBEEQ_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      UBEEQ_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      UBEEQ_S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12

  reference-worker:
    build:
      context: ../..
      dockerfile: examples/machine/scalable-single-cell/Dockerfile
    command: node apps/reference-api/dist/machine-worker.js
    environment: *ubeeq-environment
    depends_on:
      reference-api:
        condition: service_healthy

  reference-web:
    build:
      context: ../..
      dockerfile: examples/machine/scalable-single-cell/Dockerfile
    command: node apps/web-reference/src/server.mjs
    environment:
      PORT: "4173"
      UBEEQ_REFERENCE_API_URL: http://reference-api:4100
    depends_on:
      reference-api:
        condition: service_healthy

  reference-admin:
    build:
      context: ../..
      dockerfile: examples/machine/scalable-single-cell/Dockerfile
    command: node apps/admin-reference/src/server.mjs
    environment:
      PORT: "4174"
      UBEEQ_REFERENCE_API_URL: http://reference-api:4100
    depends_on:
      reference-api:
        condition: service_healthy

  caddy:
    image: caddy:2.8-alpine
    environment:
      UBEEQ_PUBLIC_HOST: ${UBEEQ_PUBLIC_HOST:?Set UBEEQ_PUBLIC_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      reference-web:
        condition: service_started
      reference-admin:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
