services:
  reference-api:
    build:
      context: ../..
      dockerfile: examples/machine/compact/Dockerfile
    command: node apps/reference-api/dist/server.js
    environment:
      PORT: "4100"
      UBEEQ_LISTEN_HOST: 0.0.0.0
      UBEEQ_PUBLIC_BASE_URL: https://${UBEEQ_PUBLIC_HOST:?Set UBEEQ_PUBLIC_HOST in .env}
      UBEEQ_INSTANCE_ID: ${UBEEQ_INSTANCE_ID:?Set UBEEQ_INSTANCE_ID in .env}
      UBEEQ_CELL_ID: ${UBEEQ_CELL_ID:?Set UBEEQ_CELL_ID in .env}
      UBEEQ_CELL_REGION: ${UBEEQ_CELL_REGION:?Set UBEEQ_CELL_REGION in .env}
      UBEEQ_CELL_OPERATOR: ${UBEEQ_CELL_OPERATOR:?Set UBEEQ_CELL_OPERATOR in .env}
      UBEEQ_CREDENTIAL_ENCRYPTION_KEY: ${UBEEQ_CREDENTIAL_ENCRYPTION_KEY:?Set UBEEQ_CREDENTIAL_ENCRYPTION_KEY in .env}
      UBEEQ_DATA_DIRECTORY: /var/lib/ubeeq
      UBEEQ_DATABASE_PATH: /var/lib/ubeeq/ubeeq.sqlite
    volumes:
      - ubeeq-data:/var/lib/ubeeq
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12

  reference-worker:
    build:
      context: ../..
      dockerfile: examples/machine/compact/Dockerfile
    command: node apps/reference-api/dist/worker.js
    environment:
      UBEEQ_PUBLIC_BASE_URL: https://${UBEEQ_PUBLIC_HOST:?Set UBEEQ_PUBLIC_HOST in .env}
      UBEEQ_INSTANCE_ID: ${UBEEQ_INSTANCE_ID:?Set UBEEQ_INSTANCE_ID in .env}
      UBEEQ_CELL_ID: ${UBEEQ_CELL_ID:?Set UBEEQ_CELL_ID in .env}
      UBEEQ_CELL_REGION: ${UBEEQ_CELL_REGION:?Set UBEEQ_CELL_REGION in .env}
      UBEEQ_CELL_OPERATOR: ${UBEEQ_CELL_OPERATOR:?Set UBEEQ_CELL_OPERATOR in .env}
      UBEEQ_CREDENTIAL_ENCRYPTION_KEY: ${UBEEQ_CREDENTIAL_ENCRYPTION_KEY:?Set UBEEQ_CREDENTIAL_ENCRYPTION_KEY in .env}
      UBEEQ_DATA_DIRECTORY: /var/lib/ubeeq
      UBEEQ_DATABASE_PATH: /var/lib/ubeeq/ubeeq.sqlite
    volumes:
      - ubeeq-data:/var/lib/ubeeq
    depends_on:
      reference-api:
        condition: service_healthy

  reference-web:
    build:
      context: ../..
      dockerfile: examples/machine/compact/Dockerfile
    command: node apps/web-reference/src/server.mjs
    environment:
      PORT: "4173"
      UBEEQ_REFERENCE_API_URL: http://reference-api:4100
    depends_on:
      reference-api:
        condition: service_healthy

  reference-admin:
    build:
      context: ../..
      dockerfile: examples/machine/compact/Dockerfile
    command: node apps/admin-reference/src/server.mjs
    environment:
      PORT: "4174"
      UBEEQ_REFERENCE_API_URL: http://reference-api:4100
    depends_on:
      reference-api:
        condition: service_healthy

  caddy:
    image: caddy:2.8-alpine
    environment:
      UBEEQ_PUBLIC_HOST: ${UBEEQ_PUBLIC_HOST:?Set UBEEQ_PUBLIC_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      reference-web:
        condition: service_started
      reference-admin:
        condition: service_started

volumes:
  ubeeq-data:
  caddy-data:
  caddy-config:
