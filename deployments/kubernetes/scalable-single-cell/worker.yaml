apiVersion: apps/v1
kind: Deployment
metadata:
  name: ubeeq-worker
  labels:
    app.kubernetes.io/name: ubeeq-worker
    app.kubernetes.io/part-of: ubeeq
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ubeeq-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ubeeq-worker
        app.kubernetes.io/part-of: ubeeq
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/ubeeq/ubeeq-reference
          command: ["node", "apps/reference-api/dist/machine-worker.js"]
          envFrom:
            - configMapRef: { name: ubeeq-cell-config }
            - secretRef: { name: ubeeq-cell-runtime }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
