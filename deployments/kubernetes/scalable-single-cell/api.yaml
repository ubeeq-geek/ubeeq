apiVersion: apps/v1
kind: Deployment
metadata:
  name: ubeeq-api
  labels:
    app.kubernetes.io/name: ubeeq-api
    app.kubernetes.io/part-of: ubeeq
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ubeeq-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ubeeq-api
        app.kubernetes.io/part-of: ubeeq
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/ubeeq/ubeeq-reference
          command: ["node", "apps/reference-api/dist/machine-server.js"]
          ports: [{ name: http, containerPort: 4100 }]
          envFrom:
            - configMapRef: { name: ubeeq-cell-config }
            - secretRef: { name: ubeeq-cell-runtime }
          env: [{ name: PORT, value: "4100" }]
          readinessProbe: { httpGet: { path: /ready, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
