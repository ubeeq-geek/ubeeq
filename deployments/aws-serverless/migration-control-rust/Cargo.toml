[package]
name = "ubeeq-migration-control-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
base64 = "0.22"
lambda_runtime = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"

[profile.release]
strip = true
