[package]
name = "ubeeq-migration-control-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[[bin]]
name = "migration-worker"
path = "src/worker.rs"
required-features = ["worker"]

[features]
worker = ["dep:aws-sdk-lambda", "dep:aws-sdk-s3", "dep:tempfile"]

[dependencies]
aws-sdk-lambda = { version = "1", optional = true, default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-s3 = { version = "1", optional = true, default-features = false, features = ["rt-tokio", "default-https-client"] }
sha2 = "0.11"
tempfile = { version = "3", optional = true }
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
base64 = "0.22"
lambda_runtime = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
icu_collator = "2"
icu_locale = "2"
ryu-js = "1"
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
