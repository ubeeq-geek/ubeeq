[package]
name = "ubeeq-reference-web"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
lambda_runtime = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
strip = true
