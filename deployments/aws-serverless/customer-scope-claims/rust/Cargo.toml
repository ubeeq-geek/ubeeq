[package]
name = "ubeeq-customer-scope-claims"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-lambda = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
lambda_runtime = "1"
regex = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
strip = true
